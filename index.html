<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Filadelphia Social Food · Menú</title>
  <meta name="description" content="Menú digital de Filadelphia Social Food: salchipapas, alitas, burgers, hot dogs y más. Pide por WhatsApp.">
  <meta name="theme-color" content="#15100e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="logo" aria-hidden="true">🔥</div>
      <p class="kicker">Social Food</p>
      <h1 id="bizName">Filadelphia</h1>
      <p class="tagline">Salchipapas cargadas, alitas y burgers. Arma tu pedido y llega directo a nuestro WhatsApp.</p>
      <p class="mesa-banner" id="mesaBanner" hidden></p>
      <ul class="pills">
        <li id="coverage"></li>
        <li>💬 Pedidos por WhatsApp</li>
      </ul>
    </div>
  </header>

  <nav class="catnav" aria-label="Categorías del menú">
    <div class="catnav-track" id="catnav"></div>
  </nav>

  <main id="menu" class="menu"></main>

  <footer class="foot">
    <p>Precios en pesos colombianos (COP). Imágenes de referencia.</p>
  </footer>

  <button class="cart-fab" id="cartFab" type="button" hidden>
    <span class="fab-count" id="fabCount">0</span>
    <span>Ver pedido</span>
    <strong id="fabTotal">$0</strong>
  </button>

  <!-- Modal de producto / modificadores -->
  <dialog id="productDlg" class="sheet" aria-labelledby="pName">
    <form id="productForm" method="dialog">
      <div class="sheet-head">
        <div class="sheet-img" id="pImg"></div>
        <button class="close" value="cancel" formnovalidate aria-label="Cerrar">✕</button>
      </div>
      <div class="sheet-body">
        <h2 id="pName"></h2>
        <p class="muted" id="pDesc"></p>
        <div id="pGroups"></div>
        <label class="group">
          <span class="group-title">Instrucciones especiales <small>Opcional</small></span>
          <textarea name="note" rows="2" maxlength="140" placeholder="Ej: sin cebolla, salsas aparte…"></textarea>
        </label>
      </div>
      <div class="sheet-foot">
        <div class="stepper" aria-label="Cantidad">
          <button type="button" data-step="-1" aria-label="Quitar uno">−</button>
          <output id="pQty">1</output>
          <button type="button" data-step="1" aria-label="Agregar uno">+</button>
        </div>
        <button class="btn-primary" id="pAdd" type="submit" value="add">Agregar · <span id="pTotal">$0</span></button>
      </div>
    </form>
  </dialog>

  <!-- Carrito / checkout -->
  <dialog id="cartDlg" class="sheet" aria-labelledby="cartTitle">
    <form id="checkoutForm" method="dialog" novalidate>
      <div class="sheet-bar">
        <h2 id="cartTitle">Tu pedido</h2>
        <button class="close" value="cancel" formnovalidate aria-label="Cerrar">✕</button>
      </div>
      <div class="sheet-body">
        <ul class="lines" id="lines"></ul>

        <fieldset class="seg" aria-label="Tipo de pedido">
          <label><input type="radio" name="type" value="mesa" checked><span>🍽️ Para la mesa</span></label>
          <label><input type="radio" name="type" value="domicilio"><span>🛵 Domicilio</span></label>
        </fieldset>

        <label class="field">Nombre
          <input name="name" required autocomplete="name" placeholder="¿A nombre de quién?">
        </label>

        <fieldset class="fields" id="fMesa">
          <label class="field">Número de mesa
            <input name="mesa" required inputmode="numeric" placeholder="Ej: 5">
          </label>
        </fieldset>

        <fieldset class="fields" id="fDomicilio" disabled hidden>
          <label class="field">Dirección
            <input name="address" required autocomplete="street-address" placeholder="Calle, número, barrio">
          </label>
          <label class="field">Indicaciones <small>Opcional</small>
            <input name="ref" placeholder="Apto, torre, punto de referencia">
          </label>
          <label class="field">Teléfono
            <input name="phone" required type="tel" inputmode="tel" autocomplete="tel" placeholder="300 123 4567">
          </label>
          <label class="field">Método de pago
            <select name="pay" required id="paySelect"><option value="">Selecciona…</option></select>
          </label>
          <p class="muted small">El valor del domicilio se confirma por WhatsApp.</p>
        </fieldset>
      </div>
      <div class="sheet-foot col">
        <div class="total-row"><span>Total</span><strong id="cartTotal">$0</strong></div>
        <button class="btn-wa" id="sendBtn" type="submit" value="send">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.2c0-.1-.2-.2-.5-.3Z"/></svg>
          Enviar pedido por WhatsApp
        </button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
